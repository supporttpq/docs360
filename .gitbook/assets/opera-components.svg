<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Parts of the Opera integration</title><desc id="d">Oracle OPERA Cloud holds the House allotment, the Block allotment and the reservations. Tourpaq reads the availability from Opera into its hotel allotment and sends reservations, guests and Extras to Opera. Tourpaq hotels, transports and Extras are served through the Tourpaq API to Web Booking.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5b86"/></marker></defs><rect x="0" y="0" width="1060" height="340" rx="14" fill="#ffffff"/><rect x="20" y="30" width="250" height="280" rx="12" fill="#f4f6f9" stroke="#c7cfdb" stroke-width="1.5"/><text x="145" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2230">Oracle OPERA Cloud</text><text x="145" y="83" text-anchor="middle" font-size="13" fill="#586174">The hotel's system</text><rect x="40" y="104" width="210" height="46" rx="8" fill="#dfe9f4" stroke="#2b5b86" stroke-width="1.2"/><text x="145" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">House allotment</text><text x="145" y="141" text-anchor="middle" font-size="12" fill="#586174">rooms per room type and hotel</text><rect x="40" y="162" width="210" height="46" rx="8" fill="#dfe9f4" stroke="#2b5b86" stroke-width="1.2"/><text x="145" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Block allotment</text><text x="145" y="199" text-anchor="middle" font-size="12" fill="#586174">rooms per departure and interval</text><rect x="40" y="220" width="210" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="145" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Reservations</text><text x="145" y="257" text-anchor="middle" font-size="12" fill="#586174">guest profiles, packages</text><line x1="272" y1="128" x2="416" y2="128" stroke="#2b5b86" stroke-width="2" marker-end="url(#arr)"/><text x="345" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2230">Availability</text><text x="345" y="116" text-anchor="middle" font-size="12" fill="#586174">every 10 hours</text><line x1="418" y1="226" x2="274" y2="226" stroke="#2b5b86" stroke-width="2" marker-end="url(#arr)"/><text x="345" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2230">Bookings</text><text x="345" y="264" text-anchor="middle" font-size="12" fill="#586174">block first, then House</text><text x="345" y="279" text-anchor="middle" font-size="12" fill="#586174">guests and Extras</text><rect x="420" y="30" width="250" height="280" rx="12" fill="#eef3f9" stroke="#2b5b86" stroke-width="1.5"/><text x="545" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2230">Tourpaq</text><text x="545" y="83" text-anchor="middle" font-size="13" fill="#586174">Office</text><rect x="440" y="104" width="210" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="545" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Hotel</text><text x="545" y="141" text-anchor="middle" font-size="12" fill="#586174">allotment, room codes</text><rect x="440" y="162" width="210" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="545" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Transports</text><text x="545" y="199" text-anchor="middle" font-size="12" fill="#586174">block codes</text><rect x="440" y="220" width="210" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="545" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Extras</text><text x="545" y="257" text-anchor="middle" font-size="12" fill="#586174">Opera packages</text><line x1="674" y1="170" x2="736" y2="170" stroke="#2b5b86" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="740" y="110" width="110" height="120" rx="12" fill="#f4f6f9" stroke="#c7cfdb" stroke-width="1.5"/><text x="795" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2230">API</text><text x="795" y="184" text-anchor="middle" font-size="12" fill="#586174">Tourpaq API</text><line x1="854" y1="170" x2="916" y2="170" stroke="#2b5b86" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="920" y="110" width="120" height="120" rx="12" fill="#f4f6f9" stroke="#c7cfdb" stroke-width="1.5"/><text x="980" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2230">Web</text><text x="980" y="184" text-anchor="middle" font-size="12" fill="#586174">Web Booking</text></svg>