<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 350" width="1060" height="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Parts of the SkiStar integration</title><desc id="d">SkiStar's Booking API holds the resorts and the accommodations. Twice a day, SkiStar Sync reads allotment and cost from SkiStar into Allotment per Day and Room Costs; price lists use them, and Tourpaq Office and Web Booking sell the packages. When a booking takes a room, Tourpaq asks SkiStar whether the accommodation is free. The booking itself is made by hand in SkiStar. Setup in Tourpaq: the hotel managed by Skistar with its SkiStar Resort ID, room types per stay length, and the stay lengths per resort in System Setup.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5b86"/></marker></defs><rect x="0" y="0" width="1060" height="350" rx="14" fill="#ffffff"/><rect x="20" y="30" width="240" height="290" rx="12" fill="#f4f6f9" stroke="#c7cfdb" stroke-width="1.5"/><text x="140" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2230">SkiStar Booking API</text><text x="140" y="83" text-anchor="middle" font-size="13" fill="#586174">SkiStar's system</text><rect x="38" y="112" width="204" height="46" rx="8" fill="#dfe9f4" stroke="#2b5b86" stroke-width="1.2"/><text x="140" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Resorts</text><text x="140" y="149" text-anchor="middle" font-size="12" fill="#586174">Sälen 1 · Hemsedal 4 · Trysil 5</text><rect x="38" y="170" width="204" height="46" rx="8" fill="#dfe9f4" stroke="#2b5b86" stroke-width="1.2"/><text x="140" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Accommodations</text><text x="140" y="207" text-anchor="middle" font-size="12" fill="#586174">one house or apartment each</text><rect x="38" y="228" width="204" height="46" rx="8" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 4"/><text x="140" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Bookings</text><text x="140" y="265" text-anchor="middle" font-size="12" fill="#586174">made by hand in SkiStar</text><line x1="262" y1="135" x2="476" y2="135" stroke="#2b5b86" stroke-width="2" marker-end="url(#arr)"/><text x="369" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2230">Allotment and cost</text><text x="369" y="153" text-anchor="middle" font-size="12" fill="#586174">twice a day (SkiStar Sync)</text><line x1="476" y1="251" x2="262" y2="251" stroke="#2b5b86" stroke-width="2" marker-end="url(#arr)"/><text x="369" y="241" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2230">Is it free?</text><text x="369" y="269" text-anchor="middle" font-size="12" fill="#586174">when a booking takes a room</text><rect x="460" y="30" width="580" height="290" rx="12" fill="#f4f6f9" stroke="#c7cfdb" stroke-width="1.5"/><text x="750" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2230">Tourpaq</text><text x="750" y="83" text-anchor="middle" font-size="13" fill="#586174">Tourpaq Office and Web Booking</text><text x="610" y="104" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#586174">DATA</text><text x="890" y="104" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#586174">SETUP</text><rect x="480" y="112" width="260" height="46" rx="8" fill="#dfe9f4" stroke="#2b5b86" stroke-width="1.2"/><text x="610" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Allotment per Day · Room Costs</text><text x="610" y="149" text-anchor="middle" font-size="12" fill="#586174">free 1 or 0 · Per Room Per Stay</text><line x1="610" y1="159" x2="610" y2="168" stroke="#2b5b86" stroke-width="2" marker-end="url(#arr)"/><rect x="480" y="170" width="260" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="610" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Price lists</text><text x="610" y="207" text-anchor="middle" font-size="12" fill="#586174">room + transport of the same stay</text><line x1="610" y1="217" x2="610" y2="226" stroke="#2b5b86" stroke-width="2" marker-end="url(#arr)"/><rect x="480" y="228" width="260" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="610" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Bookings</text><text x="610" y="265" text-anchor="middle" font-size="12" fill="#586174">sold in Office and Web Booking</text><rect x="760" y="112" width="260" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="890" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Hotel</text><text x="890" y="149" text-anchor="middle" font-size="12" fill="#586174">Managed by: Skistar · SkiStar Resort ID</text><rect x="760" y="170" width="260" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="890" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">Room types, one per stay</text><text x="890" y="207" text-anchor="middle" font-size="12" fill="#586174">23030-7D4 · 23030-7D7</text><rect x="760" y="228" width="260" height="46" rx="8" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/><text x="890" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2230">System Setup → SkiStar Resort</text><text x="890" y="265" text-anchor="middle" font-size="12" fill="#586174">stay lengths per resort</text><text x="530" y="341" text-anchor="middle" font-size="12" fill="#586174">Sunday arrivals · up to 7 nights · current and next season</text></svg>